[package]
name = "mahbot"
version = "0.4.1"
authors = ["edezhic <edezhic@gmail.com>"]
description = "An autonomous agentic engineering system that manages software development through role separation, subagents, and deterministic diagnostics."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edezhic/mahbot"
homepage = "https://github.com/edezhic/mahbot"
readme = "README.md"
keywords = ["ai", "agent"]
categories = ["development-tools"]
rust-version = "1.96"
resolver = "2"
# `vendor/` holds canonical sources of pinned forks that cannot be published
# with mahbot.  The last such fork (candle-onnx-mahbot) was removed in
# mahbot-1776 (replaced by the in-repo runtime in src/onnx), so the directory
# is currently unused; the exclude keeps any future vendored tree out of the
# published .crate.
exclude = [".DS_Store", "vendor/"]

[features]
# `full` is a default-on marker feature used by `required-features` on the app
# binary ([[bin]]).  It gates NO code or dependencies itself; it exists so that
# `--no-default-features` bench builds skip the binary entirely — the bin is a
# second full-program link that bench runs never exercise.
default = ["full"]
full = []
voice-tests = []
voice-debug = []
# Gates the two-writer checkpoint-race repro harness (benches/wal_race_repro.rs),
# a discovery/regression instrument — not part of default bench builds.
wal-repro = []
# Gates the orphaned-WAL repro harness (benches/wal_orphan_repro.rs): an
# external sqlite3 closing a live multiprocess-wal db truncates the -wal and
# strands the -tshm index (class-A incident escalation artifact).
wal-orphan-repro = []
# Gates the macOS fcntl lock-drop repro harness (benches/lock_drop_repro.rs):
# POSIX F_SETLK process-scoped .tshm byte locks are released by an unrelated
# close on macOS; the two-process harness demonstrates the drop and the
# resulting reader-slot panic (class-C escalation artifact).
lock-drop-repro = []
# Gates the lock-drop -> Exclusive-repair -> stale durable frame index repro
# harness (benches/wal_stale_index_repro.rs): the same macOS close-drop lets a
# second process classify the open Exclusive, repair the shared authority from
# a stale local WAL scan, and strand a desynced durable index — class-A
# write-path panics and class-B durable table/index desync (escalation
# artifact, probabilistic: batch protocol + control group inside the bench).
wal-stale-index-repro = []
# Gates the grep-engine subprocess end-to-end harness (benches/grep_engine_e2e.rs):
# the parent rewrites commands and spawns `sh -c` with the bench binary acting as
# the hidden engine subcommand, then diffs against the real system grep.
grep-engine-e2e = []

[[bin]]
name = "mahbot"
path = "src/main.rs"
# Skip the app binary for `--no-default-features` builds.  The canonical bench
# invocation `cargo bench --no-default-features --features voice-tests` uses
# this to avoid the bin's full-program link.
# NOTE: `bench = false` does NOT prevent `cargo bench` from building the bin
# (rust-lang/cargo#15702); `required-features` is the reliable mechanism.
required-features = ["full"]

[lib]
name = "mahbot"
path = "src/lib.rs"

[dependencies]
# Async
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false }

# Native GUI dashboard
iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu", "markdown", "advanced", "image-without-codecs"] }
iced_fonts = { version = "0.3", default-features = false, features = ["lucide", "advanced_text"] }
# The same markdown parser iced_widget uses (resolved to the lock's 0.12.2 —
# no new crates). The Sessions transcript pre-scans it to find HTML regions
# (angle-bracket tag blocks) and escape only those, so they render as literal
# text instead of being dropped at parse time (mahbot-1830).
pulldown-cmark = "0.12"
iced_anim = "0.3"
iced_selection = { version = "0.5", features = ["markdown"] }
iced_term = "0.8.0"

# HTTP / WebSocket client
# 0.13: `rustls-tls` feature is gone; the ring TLS provider is installed
# explicitly via the direct `rustls` dep (rustls-no-provider path — no
# aws-lc-rs/cmake C build). The `query` feature is required by the Telegram
# integration's HTTP query call.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "stream", "multipart", "query", "rustls-no-provider"] }
# Ring crypto provider for reqwest's rustls-no-provider path. Installed before
# any HTTP client is created (see `util::http::install_ring_provider`). Root
# certificates come from the OS trust store (macOS Keychain) via
# rustls-platform-verifier; bundled roots are deliberately not used.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Embed files into the binary
rust-embed = "8"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"

# Logging
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }

# Error handling
anyhow = "1.0"

# Self-replace for cross-platform binary swap during self-update
self-replace = "1.5"

rodio = { version = "0.22", default-features = false, features = ["playback", "hound"] }

# Utils
base64 = "0.22"
jsonrepair-rs = "0.2"
rand = "0.10"
semver = "1"
tempfile = "3"
unicode-normalization = "0.1"

# Memory / persistence
# Pinned exactly: the wal_race_repro / wal_stale_index_repro benches are the
# escalation artifacts for the turso two-writer WAL defect and the macOS
# lock-drop -> stale durable index defect, so the storage layer must not drift
# under them.
turso = { version = "=0.7.2", default-features = false, features = ["fts"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Regex
regex = "1.13"

# Fast file/content search for the tools
fff-search = "0.10"

# Transparent grep interception engine (shell tool, read-only mode): the
# ripgrep substrate (grep-regex/grep-searcher/grep-matcher) plus the ignore
# crate for rg-default exclusion semantics on recursive walks. grep-searcher
# pulls in encoding_rs/encoding_rs_io unconditionally — WHATWG-derived tables,
# BSD-3-Clause-licensed, permissive (same family as ripgrep itself).
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
ignore = "0.4"

# SHA256 checksum verification for model downloads
sha2 = "0.10"
paste = "1.0"

# Enum derive helpers
strum = { version = "0.27", features = ["derive"] }

# Embeddings
tokenizers = "0.22"
candle-core = "0.11.0"

# Neural voice activity detection (replaces RMS-based VAD)
earshot = "1.2"

# Audio capture for voice assistant
cpal = "0.18"

# Audio decoding for local transcriber input (OGG/Opus → raw PCM)
ogg = "0.9"
opus-decoder = "0.1"

# MP3 decoding
minimp3 = "0.5"

# Image decode/re-encode for reference-image compression (already compiled via
# iced's image-without-codecs feature; promoted to a direct dependency for the
# loader). Codec support is deliberately trimmed to PNG/JPEG/WebP only — gif
# and bmp are NOT supported anywhere (routing, MIME mapping, decode).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Tree-sitter for code navigation
# The core and the bash grammar are exact-pinned: the read-only shell guard
# walks the bash CST, so grammar/ABI drift must fail loudly at build time.
tree-sitter = "=0.26.12"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "=0.25.1"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-nn = { version = "0.11.0", features = ["accelerate"] }
qwen-asr = { version = "0.11.0", default-features = false, features = ["blas", "vdsp"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-nn = "0.11.0"
qwen-asr = { version = "0.11.0", default-features = false }

[dev-dependencies]
http = "1.5"
serial_test = "3"

[[bench]]
name = "wake_word"
harness = false
required-features = ["voice-tests"]

[[bench]]
name = "wal_race_repro"
harness = false
required-features = ["wal-repro"]

[[bench]]
name = "wal_orphan_repro"
harness = false
required-features = ["wal-orphan-repro"]

[[bench]]
name = "lock_drop_repro"
harness = false
required-features = ["lock-drop-repro"]

[[bench]]
name = "wal_stale_index_repro"
harness = false
required-features = ["wal-stale-index-repro"]

[[bench]]
name = "grep_engine_e2e"
harness = false
required-features = ["grep-engine-e2e"]

[profile.dev]
incremental = true
opt-level = 0
debug = "line-tables-only"
codegen-units = 256

[profile.dev.package."*"]
debug = false

# qwen-asr (local speech-to-text, macOS/Linux) is inference code: opt-level 3 +
# codegen-units 1 keeps transcription fast enough for real-time voice use even
# in dev builds, where the default opt-level 0 would make the ASR model
# noticeably slower. This override is deliberately placed under `profile.dev`
# (not `profile.test`): `[profile.test]` inherits `dev`, so test builds already
# share the same optimized qwen-asr artifact. A separate `[profile.test.package.qwen-asr]`
# override would produce a SECOND artifact fingerprint (2× disk, one-time full
# recompile of qwen-asr per clean test run) without any runtime benefit — tests
# exercise the same optimized code — and could regress warm test-cache reuse.
# The dependency-compilation behavior of per-package test overrides was verified
# empirically on cargo 1.97.1; the dev override already covers
# tests, so no test override is added.
[profile.dev.package.qwen-asr]
opt-level = 3
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
debug = 0
codegen-units = 256

[profile.release]
opt-level = 2
lto = false
codegen-units = 32
incremental = true
strip = false
panic = "unwind"

[profile.test]
inherits = "dev"
debug = "line-tables-only"
codegen-units = 256

[profile.bench]
# Release-like (opt-level 2 / codegen-units 32 / no LTO): the bench is a
# production-performance proxy, and release codegen rebuilds ~3-4x faster than
# the old opt-level 3 + fat-LTO profile.  incremental must stay explicitly off
# here — the release profile it inherits enables it.
inherits = "release"
incremental = false
