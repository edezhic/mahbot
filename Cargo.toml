[package]
name = "mahbot"
version = "0.3.0"
authors = ["edezhic <edezhic@gmail.com>"]
description = "An autonomous agentic engineering system that manages software development through role separation, subagents, and deterministic diagnostics."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/edezhic/mahbot"
homepage = "https://github.com/edezhic/mahbot"
readme = "README.md"
keywords = ["ai", "agent"]
categories = ["development-tools"]
rust-version = "1.96"
resolver = "2"
exclude = [".DS_Store"]

[features]
# `full` is a default-on marker feature used by `required-features` on the app
# binary ([[bin]]).  It gates NO code or dependencies itself; it exists so that
# `--no-default-features` bench builds skip the binary entirely (the bin is a
# second full-program fat-LTO link, ~280 s of the ~357 s warm bench rebuild).
# Keeping the lib's feature surface identical between default and minimal builds
# preserves the classifier-fingerprint contract (anchor 08c9c7b2c503…,
# mahbot-1041): the minimal build must NOT perturb audio codegen.
default = ["full"]
full = []
voice-tests = []
voice-debug = []

[[bin]]
name = "mahbot"
path = "src/main.rs"
# Skip the app binary for `--no-default-features` builds.  The canonical bench
# invocation `cargo bench --no-default-features --features voice-tests` uses
# this to avoid the bin's fat-LTO link (~280 s of the warm bench rebuild).
# NOTE: `bench = false` does NOT prevent `cargo bench` from building the bin
# (rust-lang/cargo#15702); `required-features` is the reliable mechanism.
required-features = ["full"]

[lib]
name = "mahbot"
path = "src/lib.rs"

[dependencies]
# Async
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "process", "signal", "sync", "fs"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }

# Native GUI dashboard
iced = { version = "0.14", default-features = false, features = ["tokio", "wgpu", "markdown", "advanced", "image"] }
iced_fonts = { version = "0.3", default-features = false, features = ["lucide"] }
iced_anim = "0.3"
iced_selection = { version = "0.5", features = ["markdown"] }
iced_term = "0.8.0"

# HTTP / WebSocket client
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "stream", "rustls-tls", "multipart"] }

# Embed files into the binary
rust-embed = "8"

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"

# Logging
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }

# Error handling
anyhow = "1.0"

# Self-replace for cross-platform binary swap during self-update
self-replace = "1.5"

rodio = { version = "0.19", default-features = false, features = ["wav"] }

# Utils
base64 = "0.22"
jsonrepair-rs = "0.2"
rand = "0.10"
unicode-normalization = "0.1"

# Memory / persistence
turso = { version = "0.7.0", default-features = false, features = ["fts"] }

chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

# Regex
regex = "1.10"

# Fast file/content search for the tools
fff-search = "0.10"

# SHA256 checksum verification for model downloads
sha2 = "0.10"
paste = "1.0"

# Enum derive helpers
strum = { version = "0.27", features = ["derive"] }

# Embeddings
tokenizers = "0.22"
candle-core = "0.10.2"
candle-onnx = "0.10.2"

# Neural voice activity detection (replaces RMS-based VAD)
earshot = "1.1"

# Audio capture for voice assistant
cpal = "0.15"

# Audio decoding for local transcriber input (OGG/Opus → raw PCM)
ogg = "0.9"
opus-decoder = "0.1"

# MP3 decoding
minimp3 = "0.5"

imagesize = "0.14.0"

# Tree-sitter for code navigation
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-go = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
sonora-ns = "0.1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-nn = { version = "0.10.2", features = ["accelerate"] }
qwen-asr = { version = "0.9.0", default-features = false, features = ["blas", "vdsp"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSTextCheckingClient"] }
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-nn = "0.10.2"
qwen-asr = { version = "0.9.0", default-features = false }

[dev-dependencies]
http = "1.4"
tempfile = "3"
serial_test = "3"

[[bench]]
name = "voice_pipeline_e2e"
harness = false
required-features = ["voice-tests"]

[profile.dev]
incremental = true
opt-level = 0
debug = "line-tables-only"
codegen-units = 256

[profile.dev.package."*"]
debug = false

[profile.dev.package.qwen-asr]
opt-level = 3
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
debug = 0
codegen-units = 256

[profile.release]
opt-level = 2
lto = false
codegen-units = 32
incremental = true
strip = false
panic = "unwind"

[profile.test]
inherits = "dev"
debug = "line-tables-only"
codegen-units = 256

[profile.bench]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = 0
incremental = false

[patch.crates-io]
candle-onnx = { path = "vendor/candle-onnx" }
