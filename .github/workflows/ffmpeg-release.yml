# The product's own ffmpeg release pipeline.
#
# This publishes this repository's builds of upstream FFmpeg — `ffmpeg` and
# `ffprobe` — for the six platforms the product installs the pair on, linked
# against the codec, image and TLS libraries the product's video jobs need. Its tag
# prefix is `ffmpeg-v`, a stream of its own apart from the product's releases
# (`v<version>`, which `release.yml` owns) and the Bot API server's (`tgapi-v`,
# which `tgapi-release.yml` owns); nothing here runs on a `v*` tag.
#
# Every release in this stream is a prerelease, and that is what keeps the
# product's own update channel untouched: `releases/latest` — read by
# `src/self_update.rs`, `install.sh` and `install.ps1` — never names one, while a
# release asset stays downloadable by a plain HTTP client, which is how the
# product's installer (`src/ffmpeg/install.rs`) fetches the pair. The installer
# reads this stream's listing, so a build published here is picked up by every
# installed copy at its next start; nothing waits for a release of the product.
#
# One release carries all six of these, built natively, or none of them:
#
#   ffmpeg-<version>-mahbot.<revision>-macos-x86_64.tar.gz
#   ffmpeg-<version>-mahbot.<revision>-macos-aarch64.tar.gz
#   ffmpeg-<version>-mahbot.<revision>-linux-x86_64.tar.gz
#   ffmpeg-<version>-mahbot.<revision>-linux-aarch64.tar.gz
#   ffmpeg-<version>-mahbot.<revision>-windows-x86_64.zip
#   ffmpeg-<version>-mahbot.<revision>-windows-aarch64.zip
#
# and, beside them, what they were built from and how:
#
#   ffmpeg-<version>-mahbot.<revision>-source.tar.gz
#                              the upstream tree, `git archive`d from the tag the
#                              release was built from
#   x264-<short commit>-source.tar.gz, x265-<tag>-source.tar.gz,
#   libvpx-<tag>-source.tar.gz, opus-<tag>-source.tar.gz,
#   zimg-<tag>-source.tar.gz, zlib-<tag>-source.tar.gz,
#   openssl-<tag>-source.tar.gz
#                              every library linked into the pair, archived from
#                              the tree it is built from
#   LICENCE.txt                upstream's verbatim `COPYING.GPLv3`, the text of the
#                              licence the whole build is distributed under
#   BUILD-RECIPE.txt           the configure lines, the compiler identity and the
#                              digests, each written by the machine that ran that leg
#   SHA256SUMS                 one `<sha256>  <file>` line per platform archive, per
#                              source archive and for `LICENCE.txt` — not for itself,
#                              nor for `BUILD-RECIPE.txt`, which is assembled after it.
#                              The product's installer reads this platform's archive
#                              line out of it and checks the archive it downloads
#                              against it.
#
# The build is GPLv3: `--enable-gpl` is what `--enable-libx264` and
# `--enable-libx265` require, and `--enable-version3` is what the OpenSSL 3 backend
# requires beside them. The product's own licence does not change — FFmpeg stays a
# separate executable, invoked as a program and never linked into the product. The
# licence material travels inside every archive, because the licence travels with
# the binaries: `LICENCE.txt` is the build's own licence, `LICENCES.txt` the notices
# of the libraries linked into it, and `SOURCE.txt` names the source of each, with
# the archive that carries it. An archive missing one of the three is refused here,
# which is where the obligation can be enforced: the product's installer takes the
# notices from an archive that carries them and installs a build that predates them
# with the licence and source note it has, so no installation depends on the order
# in which a product release and a build of the pair are published.
#
# What the pair can do is proven per leg, by producing output with it:
# `scripts/ffmpeg-smoke.sh` writes H.264, HEVC, VP9, Opus and PNG output, reads PNG
# back, runs the zscale filter, fetches a file over https and runs the product's own
# three jobs. An encoder is proven by the stream it wrote, never by a name in
# `-encoders`; the lists any assertion reads are the build's own `-version`
# configuration line and the decoders (and demuxers) of the formats the product
# already accepts. The https fetch runs with every TLS variable removed from the
# environment and verifies the peer on every leg: a store inherited from the runner
# would prove the runner, not the build.
#
# Windows takes its TLS from SChannel — part of the system, with its own trust
# store — and the unix legs carry OpenSSL built here, so no libssl is needed on the
# owner's machine. That OpenSSL is configured with `--openssldir=/etc/ssl`, the
# platform's own store, rather than a directory inside the build prefix that exists
# only on the machine that built it. This FFmpeg (n7.1.3) reads CAs only from an
# explicit `ca_file` — its OpenSSL backend learned to fall back to the compiled-in
# store after this release — so the unix legs hand it the machine's bundle, while on
# an owner's machine https opens without one and is verified only when a bundle is
# passed. `--disable-autodetect` stops a leg from linking whatever else the runner
# image happens to carry, and `scripts/ffmpeg-build.sh` confines `pkg-config` to the
# prefix that build installed into — the toolchain's own on Windows — so the published
# recipe describes the builds that were made rather than the three images they were
# made on. The assertion step after each build reads the binary's own `-version` back
# and looks at what the binary links.
#
# Windows on ARM is its own build and never the x64 one, and no leg may stand in for
# another: a platform that cannot be built fails the release rather than being
# covered by a neighbouring archive.
#
# Each archive holds a directory named after itself — for instance
# `ffmpeg-7.1.3-mahbot.2-linux-x86_64/` — with `bin/ffmpeg` and `bin/ffprobe`
# (`ffmpeg.exe` and `ffprobe.exe` on Windows) and the three licence files at its root.
#
# `<version>` is the version the built binary reports in `ffmpeg -version` and
# `<revision>` is this file's `BUILD_REVISION`. The version is read back out of the
# binary that is published, so a tag, an archive name and the binary inside it
# cannot disagree. Dispatching this workflow is the only way a build is published,
# and a tag that exists is never re-published: a tag names one build, and assets
# changing under it would hand an installed copy a different one at the same
# version. A repaired build bumps `BUILD_REVISION` and so gets a tag of its own.
# Nothing of a release has to be recorded in the product afterwards — the
# installer verifies the archive against that release's own `SHA256SUMS`, so a
# published release is installable as it stands.
#
# No code signing and no notarization: each leg builds on the platform's own
# machine, the linker's ad-hoc signature is what lets an arm64 macOS file
# execute (so the macOS files are not stripped), and the product downloads the
# artifact itself, so no quarantine attribute is ever applied to it. On Windows
# the mingw runtime is linked statically: no DLL travels beside the exe and no
# MSVC redistributable is needed.

name: FFmpeg

# Dispatch only, on purpose: `v*` is the product's own release mark and
# `tgapi-v*` the server's, and a build of the pair is started by hand from a
# revision chosen by hand.
on:
  workflow_dispatch:

env:
  # The upstream tag every artifact is built from, the version its tree reports,
  # and the revision of this build recipe. Bumping them — and dispatching this
  # workflow — is the only way a new build is published, and an existing tag is
  # never re-published: its `SHA256SUMS` digest is what every installed copy was
  # verified against. A repaired build (a patch, a newer library) bumps
  # BUILD_REVISION and keeps the tag's version; a newer upstream revision bumps
  # FFMPEG_TAG and FFMPEG_VERSION together. The tag is 7.1's last patch release
  # rather than 7.1 itself because that is the first of the line whose libx265
  # wrapper pairs with x265 4.x — 7.1 hands the encoder the scalable-layers
  # argument x265 dropped in 4.1, and every HEVC encode ends in a segfault.
  FFMPEG_TAG: n7.1.3
  FFMPEG_VERSION: "7.1.3"
  BUILD_REVISION: 2

  # The libraries the pair is linked against, each pinned to the release whose
  # source archive the `source` job publishes and the legs compile. x264 publishes
  # no release tags, so a commit is what it is pinned by; `X264_REF` is that
  # commit's short name and the name its source archive carries.
  X264_COMMIT: 31e19f92f00c7003fa115047ce50978bc98c3a0d
  X264_REF: "31e19f92"
  X265_REF: "4.2"
  VPX_REF: "1.17.0"
  OPUS_REF: "1.6.1"
  ZIMG_REF: "3.0.6"
  ZLIB_REF: "1.3.2"
  OPENSSL_REF: "3.6.5"

permissions:
  contents: write

# One dispatch at a time: two runs publishing the same build would race for the
# same tag, and the one that arrives second is meant to find the first one's
# release and stop.
concurrency:
  group: ffmpeg-release
  cancel-in-progress: false

jobs:
  # ── The source every leg builds ───────────────────────────────────────────

  # One clone, eight archives and the licence text: the six legs compile these
  # same bytes, and these archives are what an owner asking for the source of a
  # published binary is handed.
  source:
    name: Resolve and archive the pinned source
    runs-on: ubuntu-22.04
    outputs:
      commit: ${{ steps.clone.outputs.commit }}
      host: ${{ steps.clone.outputs.host }}
    steps:
      # A tag, cloned rather than downloaded: upstream publishes no tarball
      # whose digest could be known in advance, and only a clone can say which
      # commit the tag names on the day of the run. `git.ffmpeg.org` is
      # upstream's own host; GitHub mirrors the same repository and is the
      # fallback. Which one served the clone is an output because the recipe
      # has to say.
      - name: Clone the pinned tag
        id: clone
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/ffmpeg"
          host=""
          for candidate in https://git.ffmpeg.org/ffmpeg.git https://github.com/FFmpeg/FFmpeg.git; do
            rm -rf "$dest"
            if git clone --depth 1 --branch "$FFMPEG_TAG" "$candidate" "$dest"; then
              host="$candidate"
              break
            fi
            echo "::warning::$candidate did not serve $FFMPEG_TAG"
          done
          if [ -z "$host" ]; then
            echo "::error::neither ffmpeg's own host nor the GitHub mirror served $FFMPEG_TAG"
            exit 1
          fi

          cd "$dest"
          # The tag that arrived is the tag that was asked for: a mirror that
          # moved it would otherwise publish a commit its name does not promise.
          tag="$(git describe --tags --exact-match)"
          if [ "$tag" != "$FFMPEG_TAG" ]; then
            echo "::error::the clone describes itself as '$tag', not $FFMPEG_TAG"
            exit 1
          fi

          commit="$(git rev-parse HEAD)"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Cloned $FFMPEG_TAG ($commit) from $host"

      # `git archive` of the tag: the tree and nothing else — no `.git`, no
      # build output — under the tag's own name, so it unpacks beside the
      # archives of the binaries.
      - name: Archive the source
        run: |
          set -euo pipefail
          name="ffmpeg-$FFMPEG_VERSION-mahbot.$BUILD_REVISION-source.tar.gz"
          mkdir -p "$RUNNER_TEMP/dist"
          git -C "$RUNNER_TEMP/ffmpeg" archive --format=tar.gz \
            --prefix="ffmpeg-$FFMPEG_TAG/" "$FFMPEG_TAG" \
            > "$RUNNER_TEMP/dist/$name"

          # The tree carries upstream's own `RELEASE` file, and that file — not
          # a `.git` directory, which an archive does not have — is what
          # `ffbuild/version.sh` falls back to. It is why a binary built from
          # this archive reports `7.1` and not the `n7.1` a clone's
          # `git describe` would print, and it is checked here so that the six
          # legs do not each have to discover it.
          released="$(tar -xzOf "$RUNNER_TEMP/dist/$name" "ffmpeg-$FFMPEG_TAG/RELEASE" | tr -d '\r\n')"
          if [ "$released" != "$FFMPEG_VERSION" ]; then
            echo "::error::$FFMPEG_TAG's tree says its version is '$released', not $FFMPEG_VERSION"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/dist/$name"

      # The licence the whole build is distributed under: the release publishes
      # this text beside the archives, and every archive carries the same file.
      - name: Collect the licence text
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ffmpeg/COPYING.GPLv3" "$RUNNER_TEMP/dist/LICENCE.txt"

      # Every library linked into the pair, archived from its own repository at
      # the ref pinned above, so the release hands on the source of what it
      # distributes.
      - name: Clone and archive the linked libraries
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"

          # One archive per library, taken from the project's own repository at the
          # ref pinned above: the legs compile exactly these bytes, and the release
          # hands them on, which is what the GPL asks of a binary it distributes.
          # A tag is fetched by its name and a commit by its SHA, so a ref that moved
          # would be a different archive.
          #
          # archive <name> <ref-to-fetch> <name-token> <url...>
          archive() {
            name=$1
            ref=$2
            token=$3
            shift 3
            dest="$RUNNER_TEMP/clones/$name"
            for candidate in "$@"; do
              rm -rf "$dest"
              if git init -q "$dest" &&
                 git -C "$dest" fetch -q --depth 1 "$candidate" "$ref" &&
                 git -C "$dest" checkout -q FETCH_HEAD; then
                git -C "$dest" archive --format=tar.gz \
                  --prefix="$name-$token/" -o "$dist/$name-$token-source.tar.gz" FETCH_HEAD
                echo "$name: $candidate served $ref"
                return 0
              fi
              echo "::warning::$candidate did not serve $name $ref"
            done
            echo "::error::no host served $name $ref"
            return 1
          }

          archive x264 "$X264_COMMIT" "$X264_REF" \
            https://code.videolan.org/videolan/x264.git \
            https://github.com/mirror/x264.git
          # x265's GitHub mirror is stale at 3.4, so upstream's own host —
          # Bitbucket — is the only source used for it.
          archive x265 "$X265_REF" "$X265_REF" https://bitbucket.org/multicoreware/x265_git
          archive libvpx "v$VPX_REF" "$VPX_REF" https://github.com/webmproject/libvpx.git
          archive opus "v$OPUS_REF" "$OPUS_REF" https://github.com/xiph/opus.git
          archive zimg "release-$ZIMG_REF" "$ZIMG_REF" https://github.com/sekrit-twc/zimg.git
          archive zlib "v$ZLIB_REF" "$ZLIB_REF" https://github.com/madler/zlib.git
          archive openssl "openssl-$OPENSSL_REF" "$OPENSSL_REF" https://github.com/openssl/openssl.git

      - name: Hand the source to the build legs
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # ── The six archives ──────────────────────────────────────────────────────

  build:
    name: Build ${{ matrix.target_os }}-${{ matrix.target_arch }}
    needs: source
    runs-on: ${{ matrix.runner }}
    env:
      # Spelled once: every archive name below is built from these two and from
      # the version the binary reports.
      ASSET_OS: ${{ matrix.target_os }}
      ASSET_ARCH: ${{ matrix.target_arch }}
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      SOURCE_HOST: ${{ needs.source.outputs.host }}
      # The glibc the Linux legs must be built against: `GLIBC_FLOOR` in
      # `src/self_update.rs`, checked against the runner below and pinned by
      # `ffmpeg::install::tests::the_floors_are_the_product_own`. An archive built
      # on a newer base needs that newer glibc, whatever the flags say.
      GLIBC_FLOOR: "2.35"
    strategy:
      # Every leg runs to its own end even when one fails: a release needs all
      # six, and the failing leg's own log is what the fix starts from.
      fail-fast: false
      matrix:
        include:
          # The floor is `GLIBC_FLOOR` above, and the build step below refuses
          # a base that carries a newer one.
          - runner: ubuntu-22.04
            target_os: linux
            target_arch: x86_64
          - runner: ubuntu-22.04-arm
            target_os: linux
            target_arch: aarch64
          # The floor is `-mmacosx-version-min` in the build step below, not the
          # image: the image only supplies the toolchain, so a newer one still
          # builds the same macOS 14.0 archive (`macos-14` is being retired).
          - runner: macos-15
            target_os: macos
            target_arch: aarch64
          # Intel macOS. `macos-13` has been retired, so the image `release.yml`
          # already builds its own x86_64 file on is the one used here.
          - runner: macos-15-intel
            target_os: macos
            target_arch: x86_64
          # The ARM64 leg is a real build on an ARM64 machine, never the x64
          # archive under another name.
          - runner: windows-latest
            target_os: windows
            target_arch: x86_64
          - runner: windows-11-arm
            target_os: windows
            target_arch: aarch64
    steps:
      # The scripts, and nothing else: `scripts/ffmpeg-build.sh` is the recipe every
      # leg runs and `scripts/ffmpeg-smoke.sh` is what proves its output.
      - uses: actions/checkout@v4

      - name: Take the pinned source
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-source
          path: ${{ runner.temp }}/source

      # `nasm` is what the x86 assembly of x264, x265 and libvpx is assembled
      # with, the autotools are what zimg's `autogen.sh` needs, and `cmake` with
      # `ninja` build x265, opus and zimg. ffmpeg's configure finds the installed
      # libraries through `pkg-config`, and `--disable-autodetect` keeps it from
      # linking anything else the image carries.
      - name: Install the build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build nasm pkg-config autoconf automake libtool

      # Xcode's clang and make are what macOS builds with; the rest is what the
      # libraries' own build systems need, `nasm` for their x86 assembly, the
      # autotools for zimg's `autogen.sh` and `pkg-config` for ffmpeg's configure.
      - name: Install the build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja nasm autoconf automake libtool pkg-config

      # Two toolchains, two environments: `MINGW64` targets x86_64 and
      # `CLANGARM64` targets aarch64, and each leg installs only its own. The
      # pair is clang over mingw-w64, which with `-static` links the compiler
      # runtime in, so no DLL has to travel beside the exe. `nasm` exists for the
      # x86 side only — aarch64 assembly is taken by the compiler's own assembler
      # — `cmake` and `ninja` build x265, opus and zimg, `pkgconf` is what
      # ffmpeg's configure finds the installed libraries with, the autotools are
      # what zimg's `autogen.sh` needs, and `objdump` reads the imports back out.
      - name: Set up the MSYS2 toolchain (Windows x86_64)
        if: runner.os == 'Windows' && matrix.target_arch == 'x86_64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # No `pacman -Syu` mid-run: the packages the image ships are the
          # toolchain the recipe names.
          update: false
          install: make tar zip binutils nasm autoconf automake libtool pkgconf mingw-w64-x86_64-clang mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf

      - name: Set up the MSYS2 toolchain (Windows arm64)
        if: runner.os == 'Windows' && matrix.target_arch == 'aarch64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: make tar zip binutils autoconf automake libtool pkgconf mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja mingw-w64-clang-aarch64-pkgconf

      # Some steps below come in two forms. The Windows form runs in the MSYS2 shell,
      # which exists on Windows only, and that shell is what puts the toolchain's `tar`,
      # `objdump` and `cygpath` on the path — the build needs it for its compiler and the
      # smoke proof for the `objdump` it reads the binary's imports with. The two forms of
      # a pair differ in nothing but the path prefix.
      #
      # Every archive into a directory of its own, named after the component it
      # holds, and `ffmpeg`'s must hold `configure`. The names are spelled out
      # rather than globbed, so an archive that did not arrive fails the leg here
      # and no archive can stand in for another.
      - name: Unpack the sources (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/source"
          out="$RUNNER_TEMP/src"

          mkdir -p "$out/ffmpeg"
          tar -xzf "$src/ffmpeg-$FFMPEG_VERSION-mahbot.$BUILD_REVISION-source.tar.gz" \
            -C "$out/ffmpeg" --strip-components=1

          mkdir -p "$out/x264"
          tar -xzf "$src/x264-$X264_REF-source.tar.gz" \
            -C "$out/x264" --strip-components=1

          mkdir -p "$out/x265"
          tar -xzf "$src/x265-$X265_REF-source.tar.gz" \
            -C "$out/x265" --strip-components=1

          mkdir -p "$out/libvpx"
          tar -xzf "$src/libvpx-$VPX_REF-source.tar.gz" \
            -C "$out/libvpx" --strip-components=1

          mkdir -p "$out/opus"
          tar -xzf "$src/opus-$OPUS_REF-source.tar.gz" \
            -C "$out/opus" --strip-components=1

          mkdir -p "$out/zimg"
          tar -xzf "$src/zimg-$ZIMG_REF-source.tar.gz" \
            -C "$out/zimg" --strip-components=1

          mkdir -p "$out/zlib"
          tar -xzf "$src/zlib-$ZLIB_REF-source.tar.gz" \
            -C "$out/zlib" --strip-components=1

          mkdir -p "$out/openssl"
          tar -xzf "$src/openssl-$OPENSSL_REF-source.tar.gz" \
            -C "$out/openssl" --strip-components=1

          test -f "$out/ffmpeg/configure"

      - name: Unpack the sources (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -u "$RUNNER_TEMP")"
          src="$root/source"
          out="$root/src"

          mkdir -p "$out/ffmpeg"
          tar -xzf "$src/ffmpeg-$FFMPEG_VERSION-mahbot.$BUILD_REVISION-source.tar.gz" \
            -C "$out/ffmpeg" --strip-components=1

          mkdir -p "$out/x264"
          tar -xzf "$src/x264-$X264_REF-source.tar.gz" \
            -C "$out/x264" --strip-components=1

          mkdir -p "$out/x265"
          tar -xzf "$src/x265-$X265_REF-source.tar.gz" \
            -C "$out/x265" --strip-components=1

          mkdir -p "$out/libvpx"
          tar -xzf "$src/libvpx-$VPX_REF-source.tar.gz" \
            -C "$out/libvpx" --strip-components=1

          mkdir -p "$out/opus"
          tar -xzf "$src/opus-$OPUS_REF-source.tar.gz" \
            -C "$out/opus" --strip-components=1

          mkdir -p "$out/zimg"
          tar -xzf "$src/zimg-$ZIMG_REF-source.tar.gz" \
            -C "$out/zimg" --strip-components=1

          mkdir -p "$out/zlib"
          tar -xzf "$src/zlib-$ZLIB_REF-source.tar.gz" \
            -C "$out/zlib" --strip-components=1

          mkdir -p "$out/openssl"
          tar -xzf "$src/openssl-$OPENSSL_REF-source.tar.gz" \
            -C "$out/openssl" --strip-components=1

          test -f "$out/ffmpeg/configure"

      # The script is the whole recipe — the seven libraries, their configure
      # lines and the pair itself — and it writes this leg's section of the
      # published recipe as it runs.
      - name: Build the pair (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail

          # The base's own glibc is the floor or older: a newer base silently makes
          # every archive need a newer system than the product runs on.
          if [ "$ASSET_OS" = linux ]; then
            have=$(getconf GNU_LIBC_VERSION | awk '{print $2}')
            newest=$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$have" | sort -V | tail -1)
            if [ "$newest" != "$GLIBC_FLOOR" ]; then
              echo "the build base carries glibc $have, newer than the floor $GLIBC_FLOOR" >&2
              exit 1
            fi
          fi

          # Every object, the libraries included, is built against the product's own
          # macOS floor; the script hands the flag to every compiler it drives.
          floor=""
          if [ "$RUNNER_OS" = macOS ]; then
            floor="-mmacosx-version-min=14.0"
          fi

          mkdir -p "$RUNNER_TEMP/dist"
          sh scripts/ffmpeg-build.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/deps" \
            "$RUNNER_TEMP/dist/recipe-$ASSET_OS-$ASSET_ARCH.txt" "$floor"

      - name: Build the pair (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$root/dist"
          sh scripts/ffmpeg-build.sh "$root/src" "$MINGW_PREFIX" \
            "$root/dist/recipe-$ASSET_OS-$ASSET_ARCH.txt"

      # What the script proves, on the binary that will be published: the licence
      # line of its own configuration, the libraries it needs, the decoders the
      # product accepts, and every capability by writing output — H.264, HEVC,
      # VP9, Opus, PNG written and read back, zscale, https, and the product's own
      # probe, frames and WAV jobs. The https URL is this repository's own asset,
      # so the handshake is a real one against a real certificate chain and the
      # file comes from the same place the source does.
      - name: Assert what the pair can do (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          HTTPS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/mb-icon-256.png
        run: sh scripts/ffmpeg-smoke.sh "$RUNNER_TEMP/src/ffmpeg" "$RUNNER_TEMP/smoke" "$HTTPS_URL"

      - name: Assert what the pair can do (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          HTTPS_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/mb-icon-256.png
        run: sh scripts/ffmpeg-smoke.sh "$(cygpath -u "$RUNNER_TEMP")/src/ffmpeg" "$(cygpath -u "$RUNNER_TEMP")/smoke" "$HTTPS_URL"

      # The version every name in this release carries, read from the binary
      # that will be published rather than declared anywhere: a tree that builds
      # into some other FFmpeg tags and names itself accordingly.
      - name: Read the version the binary reports (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          banner="$("$RUNNER_TEMP/src/ffmpeg/ffmpeg" -version 2>&1 | tr -d '\r')"
          version="$(printf '%s\n' "$banner" | awk '{
            for (i = 1; i < NF; i++) if ($i == "version") { print $(i + 1); exit }
          }')"
          if [ "$version" != "$FFMPEG_VERSION" ]; then
            echo "::error::the binary reports version '$version', not $FFMPEG_VERSION:"
            printf '%s\n' "$banner" | sed -n '1p'
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "The pair reports FFmpeg $version"

      - name: Read the version the binary reports (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -u "$RUNNER_TEMP")"
          banner="$("$root/src/ffmpeg/ffmpeg.exe" -version 2>&1 | tr -d '\r')"
          version="$(printf '%s\n' "$banner" | awk '{
            for (i = 1; i < NF; i++) if ($i == "version") { print $(i + 1); exit }
          }')"
          if [ "$version" != "$FFMPEG_VERSION" ]; then
            echo "::error::the binary reports version '$version', not $FFMPEG_VERSION:"
            printf '%s\n' "$banner" | sed -n '1p'
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "The pair reports FFmpeg $version"

      # The layout the product reads (`src/ffmpeg/install.rs`): a folder named
      # after the archive, `bin/` holding the two programs, and the three licence
      # files at its root. The build script wrote those beside the trees it built.
      - name: Package the archive (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src/ffmpeg"
          stem="ffmpeg-$VERSION-mahbot.$BUILD_REVISION-$ASSET_OS-$ASSET_ARCH"
          stage="$RUNNER_TEMP/stage/$stem"
          mkdir -p "$stage/bin" "$RUNNER_TEMP/dist"

          cp ffmpeg ffprobe "$stage/bin/"
          chmod 0755 "$stage/bin/ffmpeg" "$stage/bin/ffprobe"
          cp "$RUNNER_TEMP/src/LICENCE.txt" "$RUNNER_TEMP/src/LICENCES.txt" "$RUNNER_TEMP/src/SOURCE.txt" "$stage/"

          # `COPYFILE_DISABLE` keeps macOS `tar` from adding `._` extended
          # attribute entries beside the files.
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/dist/$stem.tar.gz" \
            -C "$RUNNER_TEMP/stage" "$stem"
          ls -l "$RUNNER_TEMP/dist/$stem.tar.gz"

      - name: Package the archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -u "$RUNNER_TEMP")"
          cd "$root/src/ffmpeg"
          stem="ffmpeg-$VERSION-mahbot.$BUILD_REVISION-$ASSET_OS-$ASSET_ARCH"
          stage="$root/stage/$stem"
          mkdir -p "$stage/bin" "$root/dist"

          cp ffmpeg.exe ffprobe.exe "$stage/bin/"
          cp "$root/src/LICENCE.txt" "$root/src/LICENCES.txt" "$root/src/SOURCE.txt" "$stage/"

          # `-X` keeps the owner and group of this runner out of the archive;
          # the entries are stored with `/` separators, which is what the
          # product's extractor reads.
          ( cd "$root/stage" && zip -qr -X "$root/dist/$stem.zip" "$stem" )
          ls -l "$root/dist/$stem.zip"

      # Workflow artifacts are the hand-off to the job below only; what
      # announces the pair to the product is the release the next job publishes.
      # The recipe fragment rides along so the publish job can assemble the
      # recipe the release carries.
      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  # ── The release ───────────────────────────────────────────────────────────

  # All six archives in one prerelease, plus the sources they were built from,
  # the licence text, the recipe that built them and the single checksum list
  # that covers them. Nothing becomes visible before every file is here, and the
  # tag is derived from what arrived, so it cannot name a version no artifact
  # implements.
  publish:
    name: Publish the FFmpeg prerelease
    needs: [source, build]
    runs-on: ubuntu-22.04
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      SOURCE_HOST: ${{ needs.source.outputs.host }}
    steps:
      - name: Download the six archives, the eight sources and the licence text
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      # One version, six platforms, eight sources and the licence text, one line
      # per file — and every name read back out of what arrived. A leg that
      # failed is missing here, and a missing archive fails the release instead
      # of being replaced by another.
      - name: Assemble SHA256SUMS and check all six arrived
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$RUNNER_TEMP/dist"

          sources=(*-source.tar.gz)
          if [ "${#sources[@]}" -ne 8 ]; then
            echo "::error::eight source archives were expected, ${#sources[@]} arrived"
            exit 1
          fi

          # ffmpeg's own tree is the one the pair was made from; the other seven
          # are the libraries linked into it.
          source_archive=""
          for source in "${sources[@]}"; do
            case "$source" in
              ffmpeg-*-source.tar.gz) source_archive="$source" ;;
            esac
          done
          if [ -z "$source_archive" ]; then
            echo "::error::no ffmpeg source archive arrived"
            exit 1
          fi

          # ffmpeg's releases are `<major>.<minor>`, with a third number for a
          # point release, so the version is one or more dotted numbers: the
          # first capture is all of it (the second repeats a `<n>.` of it) and
          # the third is the build revision.
          pattern='^ffmpeg-(([0-9]+\.)+[0-9]+)-mahbot\.([0-9]+)'
          pattern+='-(linux|macos|windows)-(x86_64|aarch64)\.(tar\.gz|zip)$'

          archives=(ffmpeg-*.tar.gz ffmpeg-*.zip)
          version=""
          revision=""
          count=0
          for archive in "${archives[@]}"; do
            case "$archive" in
              *-source.tar.gz) continue ;;
            esac
            if [[ ! "$archive" =~ $pattern ]]; then
              echo "::error::$archive is not ffmpeg-<version>-mahbot.<revision>-<os>-<arch>.<ext>"
              exit 1
            fi
            if [ -z "$version" ]; then
              version="${BASH_REMATCH[1]}"
              revision="${BASH_REMATCH[3]}"
            elif [ "$version" != "${BASH_REMATCH[1]}" ] || [ "$revision" != "${BASH_REMATCH[3]}" ]; then
              echo "::error::$archive names ${BASH_REMATCH[1]} build ${BASH_REMATCH[3]}, not $version build $revision"
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -ne 6 ]; then
            echo "::error::six archives were expected, $count arrived"
            exit 1
          fi

          platforms=(linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64)
          extension_of() {
            case "$1" in
              windows-*) echo zip ;;
              *) echo tar.gz ;;
            esac
          }

          missing=0
          for platform in "${platforms[@]}"; do
            name="ffmpeg-$version-mahbot.$revision-$platform.$(extension_of "$platform")"
            if [ ! -f "$name" ]; then
              echo "::error::$name did not arrive"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          expected_source="ffmpeg-$version-mahbot.$revision-source.tar.gz"
          if [ "$source_archive" != "$expected_source" ]; then
            echo "::error::the source archive is $source_archive, but the binaries are $version build $revision, so it should be $expected_source"
            exit 1
          fi

          # The seven libraries, each named by the ref this file pins: a release
          # that is missing one of them cannot hand on the source of the binary
          # it publishes.
          for component in "x264-$X264_REF" "x265-$X265_REF" "libvpx-$VPX_REF" \
            "opus-$OPUS_REF" "zimg-$ZIMG_REF" "zlib-$ZLIB_REF" "openssl-$OPENSSL_REF"; do
            name="$component-source.tar.gz"
            if [ ! -f "$name" ]; then
              echo "::error::$name did not arrive"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          if [ ! -f LICENCE.txt ]; then
            echo "::error::LICENCE.txt did not arrive"
            exit 1
          fi

          # The six platform lines in a fixed order, then the sources, then the
          # licence: a digest list that differs only when one of the files does.
          : > SHA256SUMS
          : > digests.txt
          for platform in "${platforms[@]}"; do
            sha256sum "ffmpeg-$version-mahbot.$revision-$platform.$(extension_of "$platform")" >> SHA256SUMS
          done
          cp SHA256SUMS digests.txt
          for source in "${sources[@]}"; do
            sha256sum "$source" >> SHA256SUMS
          done
          sha256sum LICENCE.txt >> SHA256SUMS
          cat SHA256SUMS

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "REVISION=$revision" >> "$GITHUB_ENV"
          echo "FFmpeg $version build $revision: six archives, eight sources, one checksum list"

      # The layout the product's installer reads out of an archive (`src/ffmpeg/install.rs`):
      # the pair under `bin/`, the three licence files at the root. The installer refuses a
      # pair, a licence text or a source note that is missing, and takes the notices only when
      # the archive carries them — so this check, not the installer, is what catches a leg
      # that dropped any of the three before the release is published.
      - name: Check every archive carries the pair and the licence material
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          for platform in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64 windows-aarch64; do
            stem="ffmpeg-$VERSION-mahbot.$REVISION-$platform"
            exe=""
            case "$platform" in
              windows-*) archive="$stem.zip"; exe=.exe; entries=$(unzip -Z1 "$archive") ;;
              *) archive="$stem.tar.gz"; entries=$(tar -tzf "$archive") ;;
            esac
            for entry in "bin/ffmpeg$exe" "bin/ffprobe$exe" LICENCE.txt LICENCES.txt SOURCE.txt; do
              printf '%s\n' "$entries" | grep -qx "$stem/$entry" || {
                echo "::error::$archive carries no $entry"
                exit 1
              }
            done
          done

      # The recipe, not the binaries, is what this release promises can be built
      # again. Its sections are the six legs' own writing and its digests are the
      # lines SHA256SUMS carries; nothing here is a hand-written claim about a
      # toolchain.
      - name: Assemble BUILD-RECIPE.txt
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd "$RUNNER_TEMP/dist"

          fragments=(recipe-linux-*.txt recipe-macos-*.txt recipe-windows-*.txt)
          if [ "${#fragments[@]}" -ne 6 ]; then
            echo "::error::six platform sections were expected, ${#fragments[@]} arrived"
            exit 1
          fi

          {
            echo "FFmpeg $VERSION, mahbot build revision $REVISION"
            echo "Release tag: ffmpeg-v$VERSION-mahbot.$REVISION"
            echo
            echo "Upstream: FFmpeg, tag $FFMPEG_TAG, commit $SOURCE_COMMIT"
            echo "Clone host: $SOURCE_HOST"
            echo "Source archive: ffmpeg-$VERSION-mahbot.$REVISION-source.tar.gz"
            echo "Licence: GNU GPL version 3, configured with --enable-gpl and"
            echo "--enable-version3. It links libx264, libx265, libvpx, libopus, zimg,"
            echo "zlib and OpenSSL (SChannel on Windows), each built from the source"
            echo "archive of its name published with this release."
            echo "The digests at the end cover the six archives this recipe built."
            echo
            echo "Each section below was written by the machine that ran that leg:"
            echo "its compiler and configure lines are the ones that ran there."
            echo
            for fragment in "${fragments[@]}"; do
              cat "$fragment"
            done
            echo "── digests ──"
            cat digests.txt
          } > BUILD-RECIPE.txt

          rm -f digests.txt
          cat BUILD-RECIPE.txt

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          tag="ffmpeg-v$VERSION-mahbot.$REVISION"
          notes="GPLv3 FFmpeg $VERSION for the product's video jobs — H.264, HEVC, VP9, Opus, PNG, zscale and https — built natively for macos-x86_64, macos-aarch64, linux-x86_64, linux-aarch64, windows-x86_64 and windows-aarch64 from upstream $FFMPEG_TAG ($SOURCE_COMMIT), mahbot build revision $REVISION"

          # An existing release is left alone: a tag names one build, so assets
          # changing under it would hand an installed copy a different one at the
          # same version. A repaired build bumps BUILD_REVISION and so gets a tag
          # of its own.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$tag already exists — bump BUILD_REVISION to publish a repaired build, or delete that release by hand if it should never have existed"
            exit 1
          fi

          # A prerelease, so `releases/latest` keeps naming the product's own
          # release; the tag points at the commit this run started from.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FFmpeg $VERSION (mahbot build $REVISION)" \
            --notes "$notes" \
            ffmpeg-*.tar.gz \
            ffmpeg-*.zip \
            x264-*-source.tar.gz \
            x265-*-source.tar.gz \
            libvpx-*-source.tar.gz \
            opus-*-source.tar.gz \
            zimg-*-source.tar.gz \
            zlib-*-source.tar.gz \
            openssl-*-source.tar.gz \
            LICENCE.txt \
            BUILD-RECIPE.txt \
            SHA256SUMS

